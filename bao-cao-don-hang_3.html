<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo xử lý đơn hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16262F;
    --ink-soft:#5A6E78;
    --surface:#FFFFFF;
    --page:#E8EDEE;
    --line:#CBD6DA;
    --field:#F3F6F7;
    --done:#1B6F55;
    --alert:#BE3A22;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.45;
    padding:32px 20px 64px;
  }
  .sheet{
    max-width:860px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }

  /* ---------- Đầu trang ---------- */
  header{
    padding:26px 28px 22px;
    border-bottom:1px solid var(--line);
  }
  h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:-.02em;
  }
  header p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:60ch;
  }

  /* ---------- Ba số tổng ---------- */
  .totals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    padding:20px 20px 8px;
  }
  .total{
    padding:18px 20px 20px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--field);
  }
  .total span{
    display:block;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
  }
  .total strong{
    display:block;
    margin-top:2px;
    font-size:44px;
    font-weight:800;
    line-height:1.05;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.03em;
  }
  #sumSent strong{color:var(--done)}
  #sumLeft strong{color:var(--alert)}

  /* ---------- Bảng ---------- */
  .scroll{
    overflow-x:auto;
    margin:0 20px 22px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--surface);
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:560px;
  }
  th,td{
    padding:0;
    text-align:right;
  }
  thead th{
    padding:14px 18px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#8A9AA2;
    background:var(--field);
    border-bottom:1px solid var(--line);
  }
  thead tr th:first-child{border-top-left-radius:13px}
  thead tr th:last-child{border-top-right-radius:13px}
  thead th:first-child,thead th:nth-child(2){text-align:left}

  tbody td{border-bottom:1px solid #E9EEF0}
  tbody tr:last-child td{border-bottom:0}
  .channel{
    width:110px;
    padding:0 18px;
    text-align:left;
    font-weight:800;
    font-size:15px;
    vertical-align:middle;
  }
  tbody tr.group-start td{border-top:2px solid var(--ink)}
  tbody tr:first-child td{border-top:0}
  .channel.ch-shopee{color:#E8501F}
  .channel.ch-tiktok{color:#111820}
  .channel.ch-viettel{color:#C4004B}
  .shop{
    text-align:left;
    padding:0 18px;
    font-weight:600;
    font-size:15px;
  }
  td.num{
    width:118px;
    border-right:1px solid #E9EEF0;
    padding:0 18px;
    height:48px;
    font-weight:700;
    font-size:16px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  td.num:last-child{border-right:0}
  .channel,.shop{border-right:1px solid #E9EEF0}
  tfoot td{border-right:1px solid var(--line)}
  tfoot td:last-child{border-right:0}
  td.num.zero{opacity:.4;font-weight:500}
  td.done{color:var(--done)}
  td.late{color:var(--alert)}

  tfoot td{
    padding:14px 18px;
    background:var(--field);
    font-weight:800;
    font-size:16px;
    font-variant-numeric:tabular-nums;
    border-top:1px solid var(--line);
  }
  tfoot td:first-child{text-align:left;border-bottom-left-radius:13px}
  tfoot td:last-child{border-bottom-right-radius:13px}
  #fDone{color:var(--done)}
  #fLate{color:var(--alert)}

  @media (max-width:620px){
    body{padding:16px 12px 40px}
    .totals{grid-template-columns:1fr;padding:16px}
    .total strong{font-size:36px}
    h1{font-size:22px}
    .scroll{margin:0 16px 18px}
  }
  @media print{
    body{background:#fff;padding:0}
    .sheet{border:0}
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1>Báo cáo xử lý đơn hàng</h1>
    <p>Số liệu xử lý đơn theo từng sàn và gian hàng.</p>
  </header>

  <section class="totals">
    <div class="total"><span>Tổng đơn in</span><strong id="tPrint">0</strong></div>
    <div class="total" id="sumSent"><span>Đơn gửi ĐVVC</span><strong id="tSent">0</strong></div>
    <div class="total" id="sumLeft"><span>Đơn chưa xử lý</span><strong id="tLeft">0</strong></div>
  </section>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th scope="col">Sàn</th>
          <th scope="col">Gian hàng</th>
          <th scope="col">Tổng đơn</th>
          <th scope="col">Đã xử lý</th>
          <th scope="col">Đơn hạn</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
      <tfoot>
        <tr>
          <td colspan="2">Tổng cộng</td>
          <td id="fTotal">0</td>
          <td id="fDone">0</td>
          <td id="fLate">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<script>
const DATA = [
  { channel:"Shopee", key:"shopee", shops:[
    { name:"GHN", v:[1,1,0] },
    { name:"Shopee WINFIT", v:[138,138,0] },
    { name:"Shopee The Good", v:[0,0,0] },
    { name:"Viettel", v:[0,0,0] }
  ]},
  { channel:"TikTok", key:"tiktok", shops:[
    { name:"TikTok WINFIT", v:[69,69,0] },
    { name:"TikTok TG", v:[0,0,0] }
  ]},
  { channel:"Viettel", key:"viettel", shops:[
    { name:"WINFIT", v:[0,0,0] },
    { name:"DRM", v:[5,5,0] },
    { name:"CBX", v:[0,0,0] }
  ]}
];

const tbody = document.getElementById("rows");
const COLS = ["Tổng đơn","Đã xử lý","Đơn hạn"];

DATA.forEach(group => {
  group.shops.forEach((shop, i) => {
    const tr = document.createElement("tr");
    if (i === 0) tr.className = "group-start";
    if (i === 0) {
      const th = document.createElement("td");
      th.className = "channel ch-" + group.key;
      th.rowSpan = group.shops.length;
      th.textContent = group.channel;
      tr.appendChild(th);
    }
    const name = document.createElement("td");
    name.className = "shop";
    name.textContent = shop.name;
    tr.appendChild(name);

    shop.v.forEach((val, c) => {
      const td = document.createElement("td");
      td.className = "num" + (c === 1 ? " done" : c === 2 ? " late" : "") + (val === 0 ? " zero" : "");
      td.dataset.col = c;
      td.textContent = val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
});

const cells = [...tbody.querySelectorAll("td.num")];

function recalc(){
  let total = 0, done = 0, late = 0;
  cells.forEach(el => {
    const v = Math.max(0, parseInt(el.textContent, 10) || 0);
    if (el.dataset.col === "0") total += v;
    if (el.dataset.col === "1") done += v;
    if (el.dataset.col === "2"){ late += v; }
  });
  const left = Math.max(0, total - done);
  fTotal.textContent = total;
  fDone.textContent = done;
  fLate.textContent = late;
  tPrint.textContent = total;
  tSent.textContent = done;
  tLeft.textContent = left;
}

recalc();
</script>
</body>
</html>
